name: Osvježi dnevne ponude

on:
  schedule:
    - cron: "15 6,8,10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node update-posts.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Spremi promjene
        run: |
          git config user.name  "marenda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "Nove dnevne ponude" && git push)
